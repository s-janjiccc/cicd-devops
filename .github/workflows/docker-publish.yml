name: Test, build & push docker image

# starts on push on main branch
on:
    push:
        branches: [ main ]

jobs:
    # name of the job
    test-and-push:
        # define OS to run
        runs-on: ubuntu-latest

        # define and do steps
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Node.js setup
              uses: actions/setup-node@v4
              with:
                node-version: 18

            - name: Install npm dependencies
              run: npm install
            
            - name: Run tests
              run: npm test

            # if test successful go forward
            - name: Login to docker hub
              if: success()
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build docker image
              if: success()
              run: docker build -t janjicdev/cicd-practice:latest .

            - name: Push to docker hub
              if: success()
              run: docker push janjicdev/cicd-practice:latest
